# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport-azure-blob"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-azure-blob"
description = "Azure Blob transport: Shared Key over the Blob REST API — list a prefix, get and delete each blob, put a Stream as a block blob — a container prefix is a Location. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# The endpoint parser, and TLS behind the `tls` feature — one TLS stack in
# the estate, the http technology's (ADR-0033).
http = { package = "xmip-core-transport-http", git = "https://github.com/IlleNilsson/xmip-core-transport-http", branch = "main" }
# Shared Key is HMAC-SHA256 under a base64 account key, base64 both ways.
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"

[features]
default = []
# HTTPS endpoints. Off by default, as it is in the http technology.
tls = ["http/tls"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
