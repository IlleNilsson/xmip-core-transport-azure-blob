# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport-azure-blob"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-azure-blob"
description = "Azure Blob transport: Shared Key over the Blob REST API — list a prefix, get and delete each blob, put a Stream as a block blob — a container prefix is a Location. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# XML character data, escaped as every reader in the estate unescapes it.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }
# The endpoint parser, the request and its answer, and TLS behind the
# `tls` feature — one TLS stack in the estate, the http technology's
# (ADR-0033).
http = { package = "xmip-core-transport-http", git = "https://github.com/IlleNilsson/xmip-core-transport-http", branch = "main" }
# Percent-encoding (RFC 3986), written once for the estate, HTTP/1.1 on the
# wire (`net::http`) and the URL an endpoint is (`net::Endpoint`).
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main" }
# Shared Key, which this crate carried with its HMAC-SHA256 and base64
# until the owner's ruling of 2026-09-22 put what Azure speaks in the
# Azure crate (ADR-0044).
azure = { package = "xmip-core-transport-azure", git = "https://github.com/IlleNilsson/xmip-core-transport-azure", branch = "main" }

[features]
default = []
# HTTPS endpoints. Off by default, as it is in the http technology.
tls = ["http/tls"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
